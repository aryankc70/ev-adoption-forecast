[project]
name = "ev-adoption-forecast"
version = "0.1.0"
description = "Production ML pipeline forecasting EV adoption curves (cars & two-wheelers) by country using diffusion modeling"
authors = [
    {name = "Aryan KC",email = "aryankc70@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "pandas (>=3.0.5,<4.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "pyarrow (>=25.0.0,<26.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "scipy (>=1.18.0,<2.0.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "xgboost (>=3.4.0,<4.0.0)",
    "mlflow-skinny (>=3.15.1,<4.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "joblib (>=1.5.3,<2.0.0)"
]

[tool.poetry]
packages = [{ include = "ev_forecast", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.16.2,<0.17.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pre-commit (>=4.6.1,<5.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "pandas-stubs (>=3.0.5.260730,<4.0.0.0)",
    "nbstripout (>=0.9.1,<0.10.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
